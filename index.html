<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saida's workouts</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A4A4E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* Sets light or dark colours before the page is drawn, so there is no flash in the evening. */
try{var s=JSON.parse(localStorage.getItem('saida.v1')||'{}'),h=new Date().getHours();document.documentElement.dataset.theme=s.theme==='dark'||(s.theme!=='light'&&(h>=19||h<6||matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}catch(e){}
</script>
<style>
/* Coconut and teal. Light colours first; the dark (evening) colours follow and apply on screen only, so printing is always light. */
:root{--bg:#FBF7F0;--card:#FFFFFF;--ink:#1B2A2B;--ink2:#55666A;
  --pri:#0F5E63;--pri-ink:#0F5E63;--hdr:#0A4A4E;--on-pri:#FFFFFF;
  --acc:#E8A317;--acc-ink:#8A5A00;--stripe:#FBF3DC;
  --line:#E6DDCC;--edge:#7B9191;--soft:#F3E3C3;--tint:#E3F0EE;--red:#B3362F;
  --fig:#0F5E63;--fig-far:#8DBFC1;--fig-prop:#A9AFA6;--fig-ground:#E6DDCC;--fig-palm:#DDEDEC;
  --ch1:#0A9396;--ch2:#CA6702;--grid:#E6DDCC;
  --cloth:#FBF3DC;--cloth-ink:#3A2E12;--gold:#D9981A;--shade:rgba(20,32,33,.55);
  --serif:"Noto Serif","Noto Serif Malayalam",Georgia,serif;--sans:"Roboto","Noto Sans Malayalam",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media screen{
:root[data-theme=dark]{--bg:#0F1C1D;--card:#172829;--ink:#F1EADC;--ink2:#A8B8B5;
  --pri:#1B7B7E;--pri-ink:#7FD4CE;--hdr:#0B2A2C;
  --acc:#F0B43C;--acc-ink:#F0B43C;--stripe:#0B2A2C;
  --line:#2C4142;--edge:#5F7A7A;--soft:#2E2A1B;--tint:#1C3334;--red:#F08A80;
  --fig:#7FD4CE;--fig-far:#3F7376;--fig-prop:#607070;--fig-ground:#2C4142;--fig-palm:#1F3A3B;
  --ch1:#14A3A0;--ch2:#D47A2E;--grid:#2C4142;--shade:rgba(0,0,0,.65);color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
html:lang(ml) body{line-height:1.7}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.5rem;margin:.2rem 0 .8rem}
h3{font-size:1.15rem;margin:0 0 .4rem}
p{margin:.3rem 0 .7rem}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri-ink);outline-offset:2px}
[hidden]{display:none!important}

.top{background:var(--hdr);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px}
.top h1{font-size:1.3rem;letter-spacing:.01em}
.langbtn{background:transparent;border:1.5px solid rgba(255,255,255,.65);color:#fff;border-radius:999px;padding:6px 14px;min-height:40px;font-size:.95rem}
.top :focus-visible{outline-color:#fff}
.kasavu{height:14px;background:linear-gradient(var(--acc) 0 4px,var(--stripe) 4px 7px,var(--acc) 7px 9px,var(--stripe) 9px 14px)}
#app.hasnav{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
main{flex:1;padding:16px 16px 22px}
.date{color:var(--ink2);margin:0;font-size:.95rem}
.hello{font-size:1.75rem;margin:0 0 .9rem}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 10px}
.wd{text-align:center;font-size:.8rem;color:var(--ink2)}
.wd b{display:grid;place-items:center;width:38px;height:38px;margin:4px auto 0;border-radius:50%;font:600 .95rem var(--sans);color:var(--ink2)}
.wd b.plan{border:2px dashed var(--edge)}
.wd b.done{background:var(--pri);color:var(--on-pri)}
.wd b.gentle{background:var(--tint);color:var(--pri-ink)}
.wd.now span{color:var(--ink);font-weight:700}
.wd.now b{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--acc)}
.streak{margin:0 0 16px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:.98rem}
.streak b{display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card.soft{background:var(--tint);border-color:transparent}
.card.tip{border-color:var(--acc);border-width:2px}
.card.flare{border:2px solid var(--acc);background:var(--soft)}
.hero{border:0;box-shadow:inset 0 0 0 2px var(--acc),inset 0 0 0 5px var(--card),inset 0 0 0 6px var(--acc);padding:22px 20px 20px;display:flex;align-items:center;gap:8px}
.hero h3{font-size:1.35rem}
.hero .meta{color:var(--ink2);margin:.2rem 0 0}
.hero>div:first-child{flex:1;min-width:0}
.herofig{flex:0 0 30%;max-width:120px}
.herofig svg,.fig svg,.thumb svg{display:block;width:100%;height:auto}

.btn{display:block;width:100%;min-height:56px;padding:12px 16px;margin:10px 0 0;border-radius:12px;border:2px solid var(--pri-ink);background:var(--card);color:var(--pri-ink);font-weight:600;text-align:center}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.big{min-height:64px;font-size:1.15rem}
.btn:disabled{opacity:.45}
.btn:active{transform:translateY(1px)}
.link{background:none;border:0;color:var(--pri-ink);text-decoration:underline;padding:10px 4px;min-height:44px;font-size:1rem;text-align:left}
.link:disabled{color:var(--edge);text-decoration:none}
.link.danger{color:var(--red)}
.hint{color:var(--ink2);font-size:.95rem}
.warn{background:var(--soft);border-left:5px solid var(--acc);padding:10px 12px;border-radius:6px}
.warn .link{display:block;padding-left:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* The one main action of a screen sits in this bar. It sticks to the bottom of the screen, just above the tabs. */
.cta{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));padding:16px 16px 12px;margin-top:-10px;background:linear-gradient(to top,var(--bg) 78%,transparent);z-index:3}
.cta.notabs{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.cta .btn{margin:0}
.cta.two{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.cta.two .btn{line-height:1.25;padding:8px 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);z-index:4}
.tabs button{background:none;border:0;padding:8px 2px 9px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;color:var(--ink2)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs .on{color:var(--pri-ink);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}

.sess h2{margin-top:.3rem}
.q{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin:1.2rem 0 .5rem;display:block}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.faces button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;min-height:86px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.faces svg{width:44px;height:44px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.faces .fc{fill:var(--soft)}
.faces .eye{fill:var(--ink);stroke:none}
.faces b{font:700 1.05rem var(--sans);font-variant-numeric:tabular-nums}
.faces .on{border-color:var(--pri-ink);box-shadow:inset 0 0 0 2px var(--pri-ink);background:var(--tint)}
.faceword{font-weight:600;min-height:1.6em;margin:.45rem 0 0}
.feel button,.seg button{min-height:54px;border-radius:12px;border:1.5px solid var(--edge);background:var(--card);font-weight:600;font-size:1.05rem}
.feel .on,.seg .on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{font-size:1rem;padding:6px}
textarea,input[type=text],input[type=time]{width:100%;border:1.5px solid var(--edge);border-radius:12px;padding:12px;background:var(--card);min-height:54px}

/* Session step: everything needed fits on one screen, with the buttons fixed at the bottom. */
main.stepm{padding:4px 16px 10px;display:flex;flex-direction:column}
.step{flex:1;display:flex;flex-direction:column}
.steptop{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.stepn{margin:0 0 5px;font-size:.92rem;font-weight:600;color:var(--ink2)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.figbox{display:flex;align-items:center;gap:12px;margin:10px 0 8px}
.fig{background:var(--card);border:1px solid var(--line);border-radius:14px}
.figbox .fig{flex:0 0 150px;width:150px}
.figctl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mini{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--pri-ink);font-weight:600;font-size:.95rem;line-height:1.2;text-align:left}
.mini svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mini[aria-pressed=true]{background:var(--tint);border-color:var(--pri-ink)}
.step h2{margin:2px 0 0;font-size:1.4rem}
.dose{font-weight:700;color:var(--pri-ink);margin:0}
.cue{margin:.15rem 0 .6rem;line-height:1.45}
.ctl{display:flex;align-items:center;gap:14px;background:var(--tint);border-radius:14px;padding:10px 12px;margin-top:auto}
.ring{position:relative;flex:0 0 112px;width:112px;height:112px;border-radius:50%;border:0;padding:0;background:var(--card);display:grid;place-items:center;touch-action:manipulation}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .trk{fill:none;stroke:var(--line);stroke-width:8}
.ring .prg{fill:none;stroke:var(--pri-ink);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring.full .prg{stroke:var(--acc)}
.ring:active{transform:scale(.97)}
.ringin{position:relative;display:flex;flex-direction:column;align-items:center}
.rv{font:700 2rem/1 var(--sans);font-variant-numeric:tabular-nums}
.rs{font-size:.9rem;font-weight:600;color:var(--pri-ink);margin-top:4px}
.ctlt{flex:1;min-width:0;line-height:1.35}
.rlab{font-weight:700;margin:0 0 2px}
.ctlt .hint{margin:0;font-size:.9rem}
.ctlt .link{padding:8px 0 4px;min-height:40px;font-size:.95rem}
.how{align-self:flex-start;padding:6px 0;min-height:40px}
.pulse{box-shadow:0 0 0 4px var(--acc)}
.sheet{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;z-index:8}
.sheetin{width:100%;max-width:560px;margin:0 auto;max-height:84vh;max-height:84dvh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.desc{max-width:34em}
.vids a{display:block;color:var(--pri-ink);padding:9px 0;border-bottom:1px solid var(--line)}
@media (max-height:700px){.figbox .fig{flex-basis:118px;width:118px}.figbox{margin:6px 0 4px}.mini{min-height:38px}.ring{flex-basis:92px;width:92px;height:92px}.rv{font-size:1.65rem}.ctl{padding:8px 10px}.step h2{font-size:1.3rem}.steptop{min-height:40px}.steptop .link{padding:6px 4px;min-height:40px}}

.center{text-align:center}
.tick{width:92px;height:92px;border-radius:50%;background:var(--pri);color:var(--on-pri);font-size:3rem;display:grid;place-items:center;margin:20px auto 14px;box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--acc)}
.cheer{font-family:var(--serif);font-size:1.2rem;max-width:22em;margin:.4rem auto 1rem}

/* Kasavu ribbons: cream cloth with a gold border, cut to a swallow tail. */
.ribbons{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin:0;padding:0}
.center .ribbons{justify-content:center;margin:0 0 14px}
.ribbons li{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.28))}
.ribbon{display:block;width:92px;min-height:86px;padding:19px 6px 22px;text-align:center;font:600 .82rem/1.25 var(--sans);color:var(--cloth-ink);
  background:linear-gradient(var(--gold) 0 6px,var(--cloth) 6px 9px,var(--gold) 9px 11px,var(--cloth) 11px);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 13px),0 100%)}

.grp{margin:0 0 18px}
.grp>h3{margin:0 0 6px;padding-top:6px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 8px}
.ex summary{display:flex;align-items:center;gap:12px;padding:8px 12px;list-style:none;min-height:64px;cursor:pointer}
.ex summary::-webkit-details-marker{display:none}
.ex summary b{display:block;font-weight:600}
.ex summary small{color:var(--ink2);font-size:.9rem}
.thumb{flex:0 0 56px}
.exbody{padding:0 14px 12px}
.safety summary{font:600 1.15rem var(--serif);cursor:pointer;min-height:32px}
.safety ul{margin:.6rem 0 0;padding-left:1.2rem}
.safety li{margin-bottom:.45rem}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:.6rem 0}
.trio div{text-align:center;padding:8px 4px;border-radius:10px;background:var(--bg)}
.trio dt{font-size:.82rem;color:var(--ink2)}
.trio dd{margin:0;font:700 1.6rem/1.2 var(--sans);font-variant-numeric:tabular-nums}
.trio dd small{font-size:.85rem;font-weight:500;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font:700 1.7rem/1.2 var(--sans);font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--ink2)}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead h3{margin:0}
.calhead button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--edge);background:var(--card);font-size:1.4rem;line-height:1}
.calhead button:disabled{opacity:.35}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cw{font-size:.75rem;color:var(--ink2)}
.cd{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:.95rem}
.cd.done{background:var(--pri);color:var(--on-pri);font-weight:700}
.cd.gentle{background:var(--tint)}
.cd.now{box-shadow:0 0 0 2.5px var(--acc)}
.cd em{position:absolute;right:1px;bottom:-2px;font:700 .62rem var(--sans);background:var(--cloth);color:var(--cloth-ink);border-radius:6px;padding:0 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--ink2);margin:.6rem 0 .2rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.lgd{background:var(--pri)}.lgg{background:var(--tint);border:1px solid var(--edge)}
.lv{line-height:1.8}
.chart{margin:0 0 18px}
.chart:last-child{margin-bottom:0}
.chart figcaption{font:600 1.05rem var(--serif);margin-bottom:4px}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{font:10px var(--sans);fill:var(--ink2)}
.readout{font-size:.95rem;font-weight:600;margin:.3rem 0 0;font-variant-numeric:tabular-nums}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border:0}
.hist small{display:block;color:var(--ink2);font-size:.9rem}
.hist em{display:block;font-style:normal;font-size:.95rem;margin-top:2px}
.empty{color:var(--ink2);text-align:center;padding:24px 8px}
.banner{background:var(--hdr);color:#fff;border-radius:12px;padding:12px 14px}

.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-weight:600;margin-bottom:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.three button{font-size:.98rem;padding:4px}
.tog{display:flex;align-items:center;gap:12px;min-height:54px;padding:4px 0}
.tog input{width:26px;height:26px;accent-color:var(--pri);flex:none}
.filebtn{display:flex;align-items:center;justify-content:center}

/* Doctor report: always drawn as a white sheet, in English, whatever the theme. */
.report{--ink:#1B2A2B;--ink2:#55666A;--card:#fff;--line:#D9D2C3;--grid:#E6DDCC;--ch1:#0A9396;--ch2:#CA6702;
  background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px 16px;font-size:.92rem;line-height:1.45;margin-top:14px}
.report h1{font-size:1.3rem}
.report h2{font-size:1.02rem;margin:1rem 0 .3rem}
.report p{margin:.15rem 0}
.report .rmeta{color:var(--ink2)}
.report dl{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:3px 12px;margin:.2rem 0 0}
.report dt{color:var(--ink2)}
.report dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.report table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.report th,.report td{padding:4px 3px;border-bottom:1px solid var(--line);text-align:right;vertical-align:bottom}
.report th{font-size:.78rem;font-weight:600;color:var(--ink2);line-height:1.2}
.report th:first-child,.report td:first-child{text-align:left;white-space:nowrap}
.report ul{margin:.2rem 0 0;padding-left:1.1rem}
.report .foot{color:var(--ink2);font-size:.8rem;margin-top:.9rem}
.report .chart{margin:0}

#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:max-content;max-width:88vw;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast,.ring .prg{transition:none}}
@page{margin:14mm}
@media print{
  .top,.kasavu,.tabs,.cta,.noprint,.figctl,#toast{display:none!important}
  body{background:#fff;font-size:12pt}
  #app{max-width:none;min-height:0}
  main{padding:0}
  #app.hasnav{padding:0}
  .ex{break-inside:avoid}
  .figbox .fig{flex-basis:130px;width:130px}
  .report{border:0;padding:0;margin:0;font-size:10pt}
  .report h2{margin-top:.7rem}
  .report .chart svg{max-width:112mm}
  .report .foot{break-inside:avoid}
}

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>This app needs JavaScript turned on.</noscript>
<script>
/* Animated stick figures. Every figure is drawn from a small set of poses and tweened in between. */
const FIG = (() => {
  const LEN = { torso: 44, head: 15, ua: 23, fa: 22, th: 34, sh: 34 };
  const R = Math.PI / 180;
  const dir = a => [Math.sin(a * R), Math.cos(a * R)];
  /* Colours come from the page theme (see the --fig tokens in the styles), so the figures follow light and dark mode. */
  const C = { body: 'var(--fig)', far: 'var(--fig-far)', prop: 'var(--fig-prop)', gold: 'var(--acc)', ground: 'var(--fig-ground)', palm: 'var(--fig-palm)' };
  const reduced = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n1 = v => Math.round(v * 10) / 10;
  const P = pts => 'M' + pts.map(p => n1(p[0]) + ' ' + n1(p[1])).join(' L');

  function ik(root, t, l1, l2, b) {
    const dx = t[0] - root[0], dy = t[1] - root[1];
    let d = Math.hypot(dx, dy) || 0.001;
    const ux = dx / d, uy = dy / d;
    d = Math.min(d, l1 + l2 - 0.05);
    d = Math.max(d, Math.abs(l1 - l2) + 0.05);
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    return [[root[0] + ux * a - uy * h * b, root[1] + uy * a + ux * h * b], [root[0] + ux * d, root[1] + uy * d]];

  shrolls: { fig: 'shrolls', kind: 'timed', group: 'warm', v: [V.neckMc],
    n: ['Shoulder rolls', 'തോൾ ചുറ്റിക്കൽ'],
    d: ['Lift both shoulders, roll them forwards and down. After a few, roll them backwards. Keep the neck relaxed.', 'രണ്ട് തോളും ഉയർത്തി മുന്നോട്ടും താഴേക്കും ചുറ്റിക്കുക. കുറച്ച് തവണ കഴിഞ്ഞ് പിന്നോട്ട് ചുറ്റിക്കുക. കഴുത്ത് അയച്ചിടുക.'] },
  ankleW: { fig: 'ankle', kind: 'timed', group: 'warm', v: [V.vaFoot],
    n: ['Ankle circles', 'കണങ്കാൽ വട്ടം തിരിക്കൽ'],
    d: ['Sit down, lift one foot and circle the ankle slowly. Change feet halfway.', 'ഇരുന്ന് ഒരു പാദം ഉയർത്തി കണങ്കാൽ പതുക്കെ വട്ടത്തിൽ തിരിക്കുക. പകുതി സമയം കഴിയുമ്പോൾ പാദം മാറ്റുക.'] },
  handsW: { fig: 'fist', kind: 'timed', group: 'warm', v: [V.handMc],
    n: ['Open and close the hands', 'കൈ തുറക്കലും അടയ്ക്കലും'],
    d: ['Slowly close both hands into loose fists, then open and stretch the fingers. Do not squeeze.', 'രണ്ട് കൈയും പതുക്കെ അയഞ്ഞ മുഷ്ടിയാക്കുക, പിന്നെ തുറന്ന് വിരലുകൾ നീട്ടുക. ശക്തിയായി ഞെരുക്കരുത്.'] },
  walk: { fig: 'walk', kind: 'timed', group: 'walk', v: [V.wweWalk],
    n: ['Walk', 'നടത്തം'],
    d: ['Walk on flat ground in supportive shoes, at a pace where you can still talk. Stand tall, look ahead and let the arms swing gently. Indoors is fine in bad weather.', 'താങ്ങുള്ള ചെരുപ്പ് ധരിച്ച്, നിരപ്പായ സ്ഥലത്ത്, സംസാരിക്കാൻ കഴിയുന്ന വേഗത്തിൽ നടക്കുക. നിവർന്ന് നിന്ന് മുന്നോട്ട് നോക്കുക, കൈകൾ പതുക്കെ വീശുക. മോശം കാലാവസ്ഥയിൽ വീട്ടിനുള്ളിൽ നടക്കാം.'] },

  sts: { fig: 'sts', kind: 'reps', group: 'str', v: [V.nhs, V.lung, V.vaKnee],
    n: ['Sit-to-stand', 'ഇരുന്ന് എഴുന്നേൽക്കൽ'],
    d: ['Sit near the front of a sturdy chair, feet hip-width apart. Lean slightly forward, stand up using your legs, then sit back down slowly. Use your hands on the chair if you need to. Look forward, not down.', 'ഉറപ്പുള്ള കസേരയുടെ മുൻഭാഗത്ത് ഇരിക്കുക; പാദങ്ങൾ ഇടുപ്പിന്റെ വീതിയിൽ. അൽപ്പം മുന്നോട്ട് ചാഞ്ഞ്, കാലുകളുടെ ബലത്തിൽ എഴുന്നേൽക്കുക, പിന്നെ പതുക്കെ ഇരിക്കുക. ആവശ്യമെങ്കിൽ കൈകൾ കസേരയിൽ വയ്ക്കാം. താഴേക്കല്ല, മുന്നോട്ട് നോക്കുക.'] },
  wallpush: { fig: 'wallpush', kind: 'reps', group: 'str', v: [V.hinge],
    n: ['Wall push-up', 'ഭിത്തിയിൽ പുഷ്-അപ്പ്'],
    d: ['Stand an arm\'s length from a wall, hands on it at chest height. Bend the elbows to bring the chest toward the wall, then push back. If wrists or fingers hurt, press with the heels of the hands and keep the fingers relaxed.', 'ഭിത്തിയിൽ നിന്ന് ഒരു കൈ അകലത്തിൽ നിന്ന് നെഞ്ചിന്റെ ഉയരത്തിൽ കൈകൾ ഭിത്തിയിൽ വയ്ക്കുക. കൈമുട്ടുകൾ മടക്കി നെഞ്ച് ഭിത്തിയോട് അടുപ്പിക്കുക, പിന്നെ തള്ളി തിരികെ വരിക. കൈത്തണ്ടയിലോ വിരലുകളിലോ വേദനയുണ്ടെങ്കിൽ ഉള്ളംകൈയുടെ ചുവട് കൊണ്ട് തള്ളുക, വിരലുകൾ അയച്ചിടുക.'] },
  bridge: { fig: 'bridge', kind: 'reps', group: 'str', v: [V.knee],
    n: ['Glute bridge', 'ഗ്ലൂട്ട് ബ്രിഡ്ജ്'],
    d: ['Lie on your back on a firm bed or mat, knees bent, feet flat. Squeeze your buttocks and lift the hips a little. Hold 3 to 5 seconds, then lower slowly. Do not arch the lower back.', 'ഉറപ്പുള്ള കട്ടിലിലോ മാറ്റിലോ മലർന്ന് കിടക്കുക; മുട്ടുകൾ മടക്കി പാദങ്ങൾ പരത്തി വയ്ക്കുക. നിതംബ പേശികൾ മുറുക്കി ഇടുപ്പ് അൽപ്പം ഉയർത്തുക. 3–5 സെക്കൻഡ് പിടിച്ച ശേഷം പതുക്കെ താഴ്ത്തുക. നടുവ് വളയ്ക്കരുത്.'] },
  calf: { fig: 'calf', kind: 'reps', group: 'str', v: [V.vaFoot, V.kent],
    n: ['Standing calf raise', 'കാൽവണ്ണ ഉയർത്തൽ'],
    d: ['Hold a counter, feet hip-width apart. Rise slowly onto your toes with the knees straight, then lower slowly until the feet are flat.', 'കൗണ്ടറിൽ പിടിച്ച് പാദങ്ങൾ ഇടുപ്പ് വീതിയിൽ വച്ച് നിൽക്കുക. മുട്ടുകൾ നിവർത്തി പതുക്കെ കാൽവിരലുകളിൽ ഉയരുക, പിന്നെ പാദങ്ങൾ പൂർണ്ണമായി നിലത്ത് വരുന്നത് വരെ പതുക്കെ താഴ്ത്തുക.'] },
  hipabd: { fig: 'hipabd', kind: 'reps', group: 'str', side: true, v: [V.kent, V.wwe],
    n: ['Leg raise to the side', 'കാൽ വശത്തേക്ക് ഉയർത്തൽ'],
    d: ['Stand tall holding a counter. Take one leg straight out to the side, body upright, toes pointing forward. Return slowly.', 'കൗണ്ടറിൽ പിടിച്ച് നിവർന്ന് നിൽക്കുക. ശരീരം നേരെ വച്ച്, കാൽവിരലുകൾ മുന്നോട്ട് ചൂണ്ടി, ഒരു കാൽ നേരെ വശത്തേക്ക് ഉയർത്തുക. പതുക്കെ തിരികെ വയ്ക്കുക.'] },
  stepup: { fig: 'stepup', kind: 'reps', group: 'str', side: true, min: 4, v: [V.step],
    n: ['Low step-up', 'താഴ്ന്ന പടി കയറൽ'],
    d: ['Use a low step, about one stair high, and hold a rail or wall. Step up with one foot, bring the other up, then step down slowly. Lead with the same leg for the whole set.', 'ഒരു പടിയുടെ ഉയരമുള്ള താഴ്ന്ന സ്റ്റെപ്പ് ഉപയോഗിക്കുക; കൈവരിയിലോ ഭിത്തിയിലോ പിടിക്കുക. ഒരു കാൽ കൊണ്ട് കയറി മറ്റേ കാലും കൊണ്ടുവരിക, പിന്നെ പതുക്കെ ഇറങ്ങുക. ഒരു സെറ്റ് മുഴുവൻ ഒരേ കാലിൽ തുടങ്ങുക.'] },

  fist: { fig: 'fist', kind: 'reps', group: 'hand', side: true, v: [V.handUnc, V.handAf, V.handMc],
    n: ['Hand: loose fist', 'കൈ: അയഞ്ഞ മുഷ്ടി'],
    d: ['Best after a warm shower or with warm hands. Hold the hand out and slowly bend it into a loose fist with the thumb outside. Do not squeeze. Open again and stretch the fingers straight.', 'കുളി കഴിഞ്ഞോ കൈ ചൂടാക്കിയ ശേഷമോ ചെയ്യുന്നതാണ് നല്ലത്. കൈ മുന്നോട്ട് നീട്ടി, തള്ളവിരൽ പുറത്താക്കി പതുക്കെ അയഞ്ഞ മുഷ്ടിയാക്കുക. ഞെരുക്കരുത്. വീണ്ടും തുറന്ന് വിരലുകൾ നേരെ നീട്ടുക.'] },
  touch: { fig: 'touch', kind: 'reps', group: 'hand', side: true, v: [V.handUnc, V.handAf],
    n: ['Hand: finger touch', 'കൈ: വിരൽ തൊടൽ'],
    d: ['Touch the thumb to the tip of each finger in turn, making an O shape, then open the hand wide. One round of four fingers counts as one.', 'തള്ളവിരൽ കൊണ്ട് ഓരോ വിരലിന്റെ അറ്റത്തും ഓരോന്നായി തൊട്ട് O ആകൃതി ഉണ്ടാക്കുക, പിന്നെ കൈ വിശാലമായി തുറക്കുക. നാല് വിരലും തൊടുന്നത് ഒരു തവണ.'] },
  fwalk: { fig: 'fwalk', kind: 'reps', group: 'hand', side: true, v: [V.handUnc, V.handAf],
    n: ['Hand: finger walk', 'കൈ: വിരൽ നടത്തം'],
    d: ['Rest the hand flat on a table. Move each finger toward the thumb, one at a time, like walking. Then spread them out again.', 'കൈ മേശപ്പുറത്ത് പരത്തി വയ്ക്കുക. ഓരോ വിരലും ഓരോന്നായി തള്ളവിരലിന്റെ ഭാഗത്തേക്ക് നടത്തുന്നതുപോലെ നീക്കുക. പിന്നെ വീണ്ടും അകറ്റുക.'] },
  kneeext: { fig: 'kneeext', kind: 'reps', group: 'mob', side: true, v: [V.vaKnee],
    n: ['Seated knee straightening', 'ഇരുന്ന് കാൽമുട്ട് നിവർത്തൽ'],
    d: ['Sit tall on a chair. Slowly straighten one knee until the leg is out in front, hold 2 to 3 seconds, then lower slowly. No weight.', 'കസേരയിൽ നിവർന്ന് ഇരിക്കുക. ഒരു കാൽമുട്ട് പതുക്കെ നിവർത്തി കാൽ മുന്നോട്ട് നീട്ടുക, 2–3 സെക്കൻഡ് പിടിക്കുക, പതുക്കെ താഴ്ത്തുക. ഭാരം വേണ്ട.'] },
  heelslide: { fig: 'heelslide', kind: 'reps', group: 'mob', side: true, v: [V.heel],
    n: ['Heel slide', 'ഹീൽ സ്ലൈഡ്'],
    d: ['Lie or sit with the legs straight. Slide one heel toward your bottom, bending the knee as far as is comfortable, then slide it back. Keep the heel on the bed or floor.', 'കാലുകൾ നീട്ടി കിടക്കുകയോ ഇരിക്കുകയോ ചെയ്യുക. ഒരു ഉപ്പൂറ്റി നിതംബത്തിന്റെ ഭാഗത്തേക്ക് തെന്നിച്ച് മുട്ട് സുഖമായി മടങ്ങുന്നിടത്തോളം മടക്കുക, പിന്നെ തിരികെ നീട്ടുക. ഉപ്പൂറ്റി കട്ടിലിലോ തറയിലോ തൊട്ടിരിക്കണം.'] },
  ankle: { fig: 'ankle', kind: 'reps', group: 'mob', side: true, v: [V.vaFoot, V.creaky],
    n: ['Ankle circles and alphabet', 'കണങ്കാൽ വട്ടവും അക്ഷരമാലയും'],
    d: ['Sit with one foot off the floor. Circle the ankle slowly, half the circles each way. When that is easy, trace letters in the air with the big toe, moving only the ankle.', 'ഒരു പാദം നിലത്തുനിന്ന് ഉയർത്തി ഇരിക്കുക. കണങ്കാൽ പതുക്കെ വട്ടത്തിൽ തിരിക്കുക; പകുതി ഒരു ദിശയിലും പകുതി മറുദിശയിലും. ഇത് എളുപ്പമാകുമ്പോൾ പെരുവിരൽ കൊണ്ട് വായുവിൽ അക്ഷരങ്ങൾ വരയ്ക്കുക; കണങ്കാൽ മാത്രം ചലിപ്പിക്കുക.'] },
  squeeze: { fig: 'squeeze', kind: 'reps', group: 'mob', v: [V.vaShoulder, V.neckMc],
    n: ['Shoulder blade squeeze', 'തോൾ എല്ലുകൾ ചേർത്ത് ഞെരുക്കൽ'],
    d: ['Sit or stand tall, arms by your sides, shoulders relaxed. Squeeze the shoulder blades back and down, hold 5 seconds, then relax. Do not shrug.', 'കൈകൾ വശങ്ങളിൽ വച്ച്, തോളുകൾ അയച്ച്, നിവർന്ന് ഇരിക്കുകയോ നിൽക്കുകയോ ചെയ്യുക. തോൾ എല്ലുകൾ പിന്നോട്ടും താഴേക്കും ചേർത്ത് ഞെരുക്കി 5 സെക്കൻഡ് പിടിക്കുക, പിന്നെ അയയ്ക്കുക. തോൾ ഉയർത്തരുത്.'] },
  balance: { fig: 'balance', kind: 'hold', group: 'bal', side: true, v: [V.bal, V.vaBal],
    n: ['Balance on one leg', 'ഒറ്റക്കാലിൽ ബാലൻസ്'],
    d: ['Stand next to a counter and hold it lightly. Shift your weight onto one leg and lift the other foot a little. Hold, then change legs.', 'കൗണ്ടറിന് അടുത്ത് നിന്ന് ലഘുവായി പിടിക്കുക. ഭാരം ഒരു കാലിലേക്ക് മാറ്റി മറ്റേ പാദം അൽപ്പം ഉയർത്തുക. പിടിച്ച ശേഷം കാൽ മാറ്റുക.'] },

  curl: { fig: 'curl', kind: 'reps', group: 'str', v: [V.upper, V.lung],
    n: ['Seated bicep curl', 'ഇരുന്ന് ബൈസെപ് കർൾ'],
    d: ['Sit tall with a weight in each hand, arms by your sides, palms forward. Keep the elbows tucked in. Bend the elbows to bring the hands toward the shoulders, then lower slowly.', 'ഓരോ കൈയിലും ഭാരം പിടിച്ച്, കൈകൾ വശങ്ങളിൽ, ഉള്ളംകൈ മുന്നോട്ട് ആക്കി നിവർന്ന് ഇരിക്കുക. കൈമുട്ടുകൾ ശരീരത്തോട് ചേർത്ത് വയ്ക്കുക. കൈമുട്ട് മടക്കി കൈകൾ തോളിന് നേരെ കൊണ്ടുവരിക, പിന്നെ പതുക്കെ താഴ്ത്തുക.'] },
  press: { fig: 'press', kind: 'reps', group: 'str', v: [V.vaSheet, V.lung],
    n: ['Seated overhead press', 'ഇരുന്ന് തലയ്ക്ക് മുകളിലേക്ക് തള്ളൽ'],
    d: ['Sit tall. Hold a light weight in each hand at shoulder height. Press both straight up until the arms are nearly straight, without locking the elbows or shrugging, then lower slowly. If overhead is uncomfortable, stop at eye level.', 'നിവർന്ന് ഇരിക്കുക. ഓരോ കൈയിലും ഭാരം കുറഞ്ഞ ഭാരം തോളിന്റെ ഉയരത്തിൽ പിടിക്കുക. കൈമുട്ട് ലോക്ക് ചെയ്യാതെയും തോൾ ഉയർത്താതെയും രണ്ട് കൈയും നേരെ മുകളിലേക്ക് തള്ളുക, പിന്നെ പതുക്കെ താഴ്ത്തുക. തലയ്ക്ക് മുകളിൽ അസ്വസ്ഥതയുണ്ടെങ്കിൽ കണ്ണിന്റെ ഉയരത്തിൽ നിർത്തുക.'] },
  row: { fig: 'row', kind: 'reps', group: 'str', v: [V.upper, V.vaBand],
    n: ['Seated row with a band', 'ബാൻഡ് ഉപയോഗിച്ച് ഇരുന്ന് വലിക്കൽ'],

  if (S.flare || !real.length || (S.snooze && S.snooze >= today())) return null;
  const td = today(), last = S.sessions[S.sessions.length - 1], canDown = S.sL > 0 || S.wL > 0;
  const ref = S.flareEnd && S.flareEnd > last.d ? S.flareEnd : last.d;

  const r2 = real.slice(-2), hard = r2.length === 2 && r2.every(s => s.feel === 3);
  const flare = S.sessions.some(s => s.flare && dayDiff(s.d, td) <= 7) || (!!S.flareEnd && dayDiff(S.flareEnd, td) <= 7);

const TM = { id: 0, end: 0, left: 0, run: false, onEnd: null, onTick: null };

function tmPause() { if (!TM.run) return; TM.left = Math.max(0, TM.end - Date.now()); TM.run = false; clearInterval(TM.id); }

function tmLeft() { return TM.run ? Math.max(0, TM.end - Date.now()) : TM.left; }

  if (TM.onTick) TM.onTick(Math.ceil(l / 1000));

}

}

/* ---------- session flow ---------- */
const RING = 326.7;
function ringHtml(val, sub, frac, full) {

}
function setRing(val, frac) {
  const v = $('#rv'), p = $('#prg');
  if (v) v.textContent = val;
  if (p) p.setAttribute('stroke-dashoffset', RING * (1 - clamp(frac, 0, 1)));
}
const setText = (id, s) => { const e = $(id); if (e) e.textContent = s; };
function initStep() {
  const a = S.active, st = a.steps[a.i], ex = EX[st.id], d = doseOf(st.id, a.t === 'G');
  RT = { id: st.id, kind: ex.kind, d, ex, phase: 'idle', round: 0, count: 0, started: false, rounds: [], tot: d.secs || 0, lab: '' };
  if (ex.kind === 'reps') for (let s = 1; s <= d.sets; s++) { if (ex.side) RT.rounds.push({ s, side: 1 }, { s, side: 2 }); else RT.rounds.push({ s }); }
  if (ex.kind === 'hold') for (let i = 0; i < d.n; i++) RT.rounds.push({ side: 1 }, { side: 2 });
  drawCtl();
}
function roundLabel() {
  const r = RT.rounds[RT.round], p = [];
  if (RT.kind === 'reps' && RT.d.sets > 1) p.push(`${t('set')} ${r.s} ${t('of')} ${RT.d.sets}`);
  if (RT.kind === 'hold' && RT.d.n > 1) p.push(`${Math.floor(RT.round / 2) + 1} ${t('of')} ${RT.d.n}`);
  if (r.side) p.push(t(r.side === 1 ? 'side1' : 'side2'));
  return p.join(', ');
}
function drawCtl() {
  const c = $('#ctl'); if (!c) return;
  const d = RT.d; let ring, lab = '', hint = '', extra = '';
  if (RT.phase === 'done') { ring = ringHtml('✓', '', 1, true); lab = t('allDone'); const b = $('#btnDone'); if (b) b.classList.add('pulse'); }
  else if (RT.kind === 'timed') { ring = ringHtml(mmss(d.secs), t('startW'), 0); hint = RT.id === 'walk' ? t('walkHint') : t('tapStart'); }
  else if (RT.phase === 'rest') { ring = ringHtml(mmss(RT.tot), '', 0); lab = t('rest'); extra = `<button class="link" data-act="skiprest">${t('skipRest')}</button>`; }
  else if (RT.kind === 'reps') { ring = ringHtml(RT.count, '/ ' + d.reps, RT.count / d.reps); lab = roundLabel(); hint = t('tapEach'); extra = `<button class="link" data-act="undo">${t('undo')}</button>`; }
  else if (RT.phase === 'idle') { ring = ringHtml(mmss(d.secs), t('startW'), 0); lab = roundLabel(); hint = t('tapStart'); }
  else { ring = ringHtml(mmss(RT.tot), t('pause'), 0); lab = RT.lab; }
  c.innerHTML = ring + `<div class="ctlt"><p class="rlab" id="rlab">${lab}</p>${hint ? `<p class="hint" id="rhint">${hint}</p>` : ''}${extra}</div>`;
}
const tick = s => setRing(mmss(s), 1 - tmLeft() / (RT.tot * 1000));
function holdSeq(gap) {
  if (gap) {
    RT.phase = 'gap'; RT.tot = RT.round === 0 ? 3 : 5; RT.lab = RT.round === 0 ? t('ready') : `${t('change')}: ${roundLabel()}`; drawCtl();
    tmStart(RT.tot, tick, () => { buzz('short'); holdSeq(false); });
  } else {
    RT.phase = 'hold'; RT.tot = RT.d.secs; RT.lab = `${t('hold')}, ${roundLabel()}`; drawCtl();
    tmStart(RT.tot, tick, () => { RT.round++; if (RT.round >= RT.rounds.length) { buzz('end'); RT.phase = 'done'; drawCtl(); } else { buzz('mid'); holdSeq(true); } });
  }
}
function pauseToggle() {
  if (TM.run) { tmPause(); setText('#rs', t('resume')); } else { tmResume(); setText('#rs', t('pause')); }
}
function ringTap() {
  if (RT.phase === 'done' || RT.phase === 'rest') return;
  if (RT.kind === 'reps') return countOne();
  if (RT.kind === 'hold') return RT.phase === 'idle' ? holdSeq(true) : pauseToggle();
  if (!RT.started) {
    RT.started = true; RT.tot = RT.d.secs; setText('#rs', t('pause')); if (RT.id !== 'walk') setText('#rhint', t('tapPause'));
    tmStart(RT.tot, tick, () => { buzz('end'); RT.phase = 'done'; drawCtl(); });
  } else pauseToggle();
}
function countOne() {

  if (RT.round === RT.rounds.length - 1) { buzz('mid'); RT.phase = 'done'; drawCtl(); return; }
  buzz('short');
  const cur = RT.rounds[RT.round], nx = RT.rounds[RT.round + 1]; RT.round++; RT.count = 0;
  if (nx.s !== cur.s) { RT.phase = 'rest'; RT.tot = 40; drawCtl(); tmStart(40, tick, () => { buzz('mid'); RT.phase = 'idle'; drawCtl(); }); }
  else { drawCtl(); toast(t('side2')); }
}

  }
  tmStop(); a.res[RT.id] = status; a.i++; save();

  render();
}

}

  const rec = { d: a.d, t: a.t, pb: a.pb, pa: pend.pa, feel: pend.feel, walk: a.walk || 0, done: vals.filter(v => v === 'done').length, skip: vals.filter(v => v === 'skip').length };
  if (note) rec.note = note; if (a.flare) rec.flare = true;
  const had = new Set(earned(metrics(S.sessions)).map(mileKey));
  S.sessions.push(rec); S.sessions.sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0);
  const m = metrics(S.sessions), wk = ymd(weekStart(parse(rec.d)));
  SAVED = { rec, total: m.total, wk: S.sessions.filter(s => ymd(weekStart(parse(s.d))) === wk).length, hard: pend.feel === 3 || pend.pa - a.pb >= 3, ribbons: earned(m).filter(x => !had.has(mileKey(x))) };
  S.active = null; save(); scr = 'saved'; render();
}

/* ---------- share, backup, calendar file ---------- */
const b64u = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = s => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
async function pack(obj) {
  const json = JSON.stringify(obj);
  try {
    if ('CompressionStream' in window) {
      const cs = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z' + b64u(new Uint8Array(await new Response(cs).arrayBuffer()));
    }
  } catch (e) { }
  return 'j' + b64u(new TextEncoder().encode(json));
}
async function unpack(s) {
  const bytes = unb64u(s.slice(1));
  if (s[0] === 'z') return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
  return JSON.parse(new TextDecoder().decode(bytes));
}
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parse(s));
const num = (v, a, b) => (typeof v === 'number' && isFinite(v)) ? clamp(Math.round(v), a, b) : null;
function cleanSessions(arr, keepNotes) {
  return (Array.isArray(arr) ? arr : []).slice(-500).map(r => {
    if (!r || !isDate(r.d) || !'ABCDG'.includes(r.t) || String(r.t).length !== 1) return null;
    const o = { d: r.d, t: r.t, pb: num(r.pb, 0, 10), pa: num(r.pa, 0, 10), feel: num(r.feel, 1, 3), walk: num(r.walk, 0, 240) || 0 };
    if (r.flare) o.flare = true;
    if (keepNotes && typeof r.note === 'string') o.note = r.note.slice(0, 300);
    return o;
  }).filter(Boolean).sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0);
}
function shareText() {
  const w = shownWeek();
  return `${S.name}, ${t(w.off ? 'lastWeek' : 'wsum')} (${w.range}): ${w.n} ${t(w.n === 1 ? 'sessionOne' : 'sessionsWord')}, ${w.walk} ${t('min')} ${t('walkWord')}.` + (w.trend ? ' ' + t(w.trend) : '');
}
async function shareProgress() {
  const snap = { n: S.name, g: today(), sL: S.sL, wL: S.wL, d4: S.day4 ? 1 : 0, s: S.sessions.slice(-200).map(s => [s.d, s.t, s.pb, s.pa, s.feel, s.walk || 0, s.flare ? 1 : 0]) };
  const url = location.origin + location.pathname + '#view=' + await pack(snap), text = shareText();
  try { if (navigator.share) { await navigator.share({ title: TXT.title[0], text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text + ' ' + url); toast(t('copied')); } catch (e) { window.prompt(t('copied'), url); }
}
function readView(o) {
  if (!o || typeof o !== 'object') throw 0;
  return { name: String(o.n || '').slice(0, 40), gen: isDate(o.g) ? o.g : today(), sL: num(o.sL, 0, STR_LADDER.length - 1) || 0, wL: num(o.wL, 0, WALK_LADDER.length - 1) || 0, day4: !!o.d4,
    sessions: cleanSessions((Array.isArray(o.s) ? o.s : []).map(r => Array.isArray(r) ? { d: r[0], t: r[1], pb: r[2], pa: r[3], feel: r[4], walk: r[5], flare: r[6] } : null)) };
}
function dl(name, mime, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function makeIcs(time) {
  const hm = /^(\d\d):(\d\d)$/.exec(time) || [0, '10', '00'], map = { 1: 'MO', 3: 'WE', 5: 'FR' }; if (S.day4) map[6] = 'SA';
  let d = new Date(); while (!map[d.getDay()]) d = addDays(d, 1);
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''), title = TXT.title[0];
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Saida workouts//EN', 'BEGIN:VEVENT', 'UID:saida-' + Date.now() + '@workouts', 'DTSTAMP:' + stamp,
    'DTSTART:' + ymd(d).replace(/-/g, '') + 'T' + hm[1] + hm[2] + '00', 'DURATION:PT40M', 'RRULE:FREQ=WEEKLY;BYDAY=' + Object.values(map).join(','), 'SUMMARY:' + title,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + title, 'TRIGGER:-PT10M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}

/* ---------- events ---------- */
const figOf = el => { const f = $('.fig', el.closest('.figbox')); return f && f._fc; };
const ACT = {
  tab(v) { tab = v; render(); },
  lang() { S.lang = ml() ? 'en' : 'ml'; save(); render(true); },
  setlang(v) { S.lang = v; save(); render(true); },
  theme(v) { S.theme = v; save(); render(true); },
  begin(v) { pend = { t: v, pb: null, fl: null }; scr = 'checkin'; render(); },
  resume() { scr = 'step'; wake(true); render(); },
  quit() { const rep = scr === 'report'; scr = null; pend = null; if (rep) tab = 'progress'; render(); },
  pain(v, el) {
    const n = +v; if (scr === 'checkin') pend.pb = n; else pend.pa = n;
    $$('.faces button').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    setText('#fw', L(PAIN_WORDS[faceIdx(n)]));
    if (scr === 'checkin') syncCheckin();
  },
  fl(v, el) { pend.fl = v === '1'; $$('#flseg button').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); syncCheckin(); },
  go() {
    if (pend.pb == null) return toast(t('pickFace'));
    if (!S.flare && pend.fl == null) return toast(t('pickFlare'));
    const flare = !!S.flare || pend.fl === true;
    beginSession(pend.t === 'G' || flare || pend.pb >= 7 ? 'G' : pend.t, pend.pb, flare);
  },
  anyway() { if (pend.fl == null) return toast(t('pickFlare')); beginSession(pend.t, pend.pb, false); },
  prev() { if (S.active.i > 0) { S.active.i--; save(); render(); } },
  early() {
    if (!Object.keys(S.active.res).length) { if (confirm(t('quitQ'))) { S.active = null; save(); scr = null; wake(false); render(); } return; }
    tmStop(); scr = 'checkout'; pend = { pa: null, feel: null, note: '' }; wake(false); render();
  },
  done() { stepEnd('done'); }, skip() { stepEnd('skip'); },
  ring() { ringTap(); },
  undo() { if (RT.count > 0) { RT.count--; setRing(RT.count, RT.count / RT.d.reps); } },
  skiprest() { tmStop(); RT.phase = 'idle'; drawCtl(); },
  how() { $('#sheet').hidden = false; },
  closeSheet(v, el, e) { if (!v && e.target !== el) return; $('#sheet').hidden = true; },
  figToggle(v, el) { const c = figOf(el); if (c) c.toggle(); },
  figAgain(v, el) { const c = figOf(el); if (c) c.again(); },
  figSlow(v, el) { S.slow = !S.slow; save(); el.setAttribute('aria-pressed', S.slow); const c = figOf(el); if (c) c.speed(S.slow ? 0.5 : 1); },
  feel(v, el) { pend.feel = +v; $$('.feel button').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); },
  saveSess() { saveSession(); },
  home() { scr = null; tab = 'today'; render(); },
  flareOn() { S.flare = today(); if (S.active && S.active.t !== 'G') S.active = null; save(); tab = 'today'; render(); },
  flareOff() { S.flare = null; S.flareEnd = today(); save(); render(); },
  lvUp(v) { setLevel(v === 's' ? 1 : 0, v === 'w' ? 1 : 0); render(true); },
  lvDown() { setLevel(-1, -1); render(true); },
  lvHard() { setLevel(S.sL <= S.wL ? 1 : 0, S.sL <= S.wL ? 0 : 1); render(true); },
  snooze() { S.snooze = ymd(addDays(new Date(), 7)); save(); render(true); },
  cal(v) { const m = calMonth || new Date(new Date().getFullYear(), new Date().getMonth(), 1); calMonth = new Date(m.getFullYear(), m.getMonth() + (+v), 1); render(true); },
  bar(v) { const w = walkWeeks()[+v]; $('#ro-w').textContent = `${t('weekOf')} ${fmtDate(w.d)}: ${w.v} ${t('min')}`; $$('#cw .mark').forEach(m => m.style.opacity = m.dataset.i === v ? 1 : 0.4); },
  pt(v) { const s = painRows()[+v]; $('#ro-p').textContent = `${fmtDate(s.d)}: ${t('before').toLowerCase()} ${s.pb}, ${t('after').toLowerCase()} ${s.pa}`; $$('#cp .mark').forEach(m => m.style.opacity = m.dataset.i === v ? 1 : 0.35); },
  rm(v) { if (confirm(t('removeQ'))) { S.sessions.splice(+v, 1); save(); render(true); } },
  share() { shareProgress(); },
  report() { scr = 'report'; render(); },
  rw(v) { RPT.w = +v; render(true); },
  printRpt() { window.print(); },
  print() { window.print(); },
  vibTest() { buzz('end'); },
  ics() { dl('saida-workouts.ics', 'text/calendar', makeIcs($('#rt').value)); },
  export() { const o = Object.assign({}, S, { active: null }); dl('saida-workouts-backup-' + today() + '.json', 'application/json', JSON.stringify(o, null, 1)); },
  async install() { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) { } installEvt = null; render(true); },
  erase() { if (confirm(t('eraseQ'))) { const lang = S.lang; S = def(); S.lang = lang; save(); tab = 'today'; render(); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset.v, el, e);
});
document.addEventListener('input', e => { if (e.target.id === 'note' && pend) pend.note = e.target.value; });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.set) { S[el.dataset.set] = el.checked; save(); return; }
  if (el.id === 'rnotes') { RPT.notes = el.checked; render(true); return; }
  if (el.id === 'nm') { S.name = el.value.trim().slice(0, 40) || 'Shahida'; save(); return; }
  if (el.id === 'imp' && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const o = JSON.parse(fr.result); if (!o || !Array.isArray(o.sessions)) throw 0;
        if (!confirm(t('importQ'))) return;
        const d = def();
        S = Object.assign(d, { lang: o.lang === 'ml' ? 'ml' : 'en', name: String(o.name || d.name).slice(0, 40), day4: !!o.day4, sound: o.sound !== false, vib: o.vib !== false, slow: !!o.slow,
          theme: ['auto', 'light', 'dark'].includes(o.theme) ? o.theme : 'auto', flare: isDate(o.flare) ? o.flare : null, flareEnd: isDate(o.flareEnd) ? o.flareEnd : null,
          sL: num(o.sL, 0, STR_LADDER.length - 1) || 0, wL: num(o.wL, 0, WALK_LADDER.length - 1) || 0, lvDate: isDate(o.lvDate) ? o.lvDate : null, sessions: cleanSessions(o.sessions, true) });
        save(); toast(t('importOk')); render();
      } catch (err) { toast(t('importBad')); }
    };
    fr.readAsText(el.files[0]);
  }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details.ex')) return;
  const slot = $('.figslot', d);
  if (d.open) { slot.innerHTML = figBox(slot.dataset.fig); d._stop = mountFig($('.figbox', slot)); } else { if (d._stop) d._stop(); d._stop = null; slot.innerHTML = ''; }
}, true);
window.addEventListener('beforeprint', () => { if (scr || tab !== 'plan') return; PRINTING = true; $$('details.ex').forEach(d => { d.open = true; }); });
window.addEventListener('afterprint', () => { PRINTING = false; });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (tab === 'settings' && !scr) render(true); });
window.addEventListener('hashchange', () => location.reload());
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') return; applyTheme(); if (scr === 'step') wake(true); });
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', applyTheme);
setInterval(applyTheme, 60000);

(async function boot() {
  load();
  if (S.active && S.active.d !== today()) { S.active = null; save(); }
  const m = /^#view=(.+)$/.exec(location.hash);
  if (m) {
    const lang = S.lang, theme = S.theme;
    try { VIEW = readView(await unpack(m[1])); S = Object.assign(def(), VIEW, { lang, theme }); } catch (e) { VIEW = { bad: true }; S = Object.assign(def(), { lang, theme }); }
  }
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
})();

</script>
